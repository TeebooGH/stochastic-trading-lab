[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-trading-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "pytest>=9.0.3",
    "tqdm>=4.67.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupytext>=1.19.2",
    "matplotlib>=3.10.9",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "statistical: marks tests as statistical (deselect with '-m \"not statistical\"')",
    "serial",
]
